name: AMUN SIGNAL Public Brand Guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify AMUN SIGNAL public identity
        run: python scripts/check_amun_public_brand.py
