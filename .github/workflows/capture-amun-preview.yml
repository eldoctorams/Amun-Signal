name: Capture AMUN SIGNAL interface

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - amun/phase-0-foundation
    paths-ignore:
      - docs/assets/amun-signal-interface.png

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install screenshot browser
        run: npx playwright install --with-deps chromium

      - name: Start AMUN SIGNAL
        run: |
          npm run dev:frontend -- --hostname 127.0.0.1 > /tmp/amun-signal-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/amun-signal-preview.log
          exit 1

      - name: Capture interface
        run: node scripts/capture-amun-preview.cjs

      - name: Publish preview image
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/amun-signal-interface.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: refresh AMUN SIGNAL interface preview"
          git push
